# SupaShare Quickstart Compose
# For hardened production deployments using dedicated non-root execution (UID/GID 10001:10001),
# read-only rootfs, and dropped capabilities, use `docker-compose.nonroot.yaml` (see docs/security/ADR-005-NONROOT-COMPOSE.md).
services:
  supashare:
    build: .
    image: supashare:local
    container_name: supashare
    ports:
      - "127.0.0.1:53842:53842"
    volumes:
      - ./gokapi-data:/app/data
      - ./gokapi-config:/app/config
    restart: always
    env_file:
      - "./.env"
